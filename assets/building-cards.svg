<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 270" width="950" height="270" role="img" aria-label="Concaretti, Heccker OS and CampUstore"><defs><linearGradient id="rb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="950" y2="0" spreadMethod="repeat"><stop offset="0.000" stop-color="#ff3d3d"/><stop offset="0.167" stop-color="#ffb800"/><stop offset="0.333" stop-color="#3ddc5a"/><stop offset="0.500" stop-color="#00d9ff"/><stop offset="0.667" stop-color="#4a6bff"/><stop offset="0.833" stop-color="#ff2d75"/><stop offset="1.000" stop-color="#ff3d3d"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="950 0" dur="8s" repeatCount="indefinite"/></linearGradient></defs><g><rect x="10" y="10" width="300" height="250" rx="16" fill="#111722" stroke="url(#rb)" stroke-width="1.6" opacity="1"/>
<rect x="34" y="34" width="48" height="48" rx="12" fill="#ff3d3d" opacity="0.18"/><text x="58" y="68" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ff3d3d">C</text>
