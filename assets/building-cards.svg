<text x="286" y="62" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8b95a5">RESEARCH</text>
<text x="34" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#f0f3f8">Concaretti</text>
<rect x="34" y="126" width="40" height="3" rx="1.5" fill="#ff3d3d"/><text x="34" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">My final-year research project.</text><text x="34" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">What happens when AI agents</text><text x="34" y="202" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">work together instead of one</text><text x="34" y="228" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">AI doing everything?</text></g><g><rect x="330" y="10" width="300" height="250" rx="16" fill="#111722" stroke="url(#rb)" stroke-width="1.6" opacity="1"/>
<rect x="354" y="34" width="48" height="48" rx="12" fill="#00d9ff" opacity="0.18"/><text x="378" y="68" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#00d9ff">H</text>
<circle cx="511" cy="58" r="4" fill="#00d9ff"><animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
<text x="606" y="62" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8b95a5">EXPLORING</text>
<text x="354" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#f0f3f8">Heccker OS</text>
<rect x="354" y="126" width="40" height="3" rx="1.5" fill="#00d9ff"/><text x="354" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">A more personal AI system.</text><text x="354" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">Useful without giving up</text><text x="354" y="202" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">security or control.</text></g><g><rect x="650" y="10" width="300" height="250" rx="16" fill="#111722" stroke="url(#rb)" stroke-width="1.6" opacity="1"/>
<rect x="674" y="34" width="48" height="48" rx="12" fill="#3ddc5a" opacity="0.18"/><text x="698" y="68" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#3ddc5a">U</text>
