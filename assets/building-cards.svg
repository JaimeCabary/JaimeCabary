<rect x="674" y="126" width="40" height="3" rx="1.5" fill="#3ddc5a"/><text x="674" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">A marketplace for campus life.</text><text x="674" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">Buy, sell, and offer services</text><text x="674" y="202" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#aab4c3">to other students, close by.</text></g></svg>