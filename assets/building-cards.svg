<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="950" height="440" role="img" aria-label="Concaretti, Heccker OS and CampUstore"><g><rect x="0" y="0" width="300" height="440" rx="16" fill="#000"/><rect x="0.5" y="0.5" width="299" height="439" rx="16" fill="none" stroke="#fff" stroke-opacity="0.12"/>
<text x="28" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-4" fill="#161616">01</text>
<circle cx="264" cy="52" r="5" fill="#FF3B3B"/>
<text x="30" y="176" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#fff">Concaretti</text>
<rect x="30" y="194" width="87.6" height="26" rx="3" fill="#141414"/><text x="73.8" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#cfcfcf" letter-spacing="1.5">RESEARCH</text>
<text x="30" y="262" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">My final-year research</text><text x="30" y="284" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">project. What happens when</text><text x="30" y="306" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">AI agents work together</text><text x="30" y="328" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">instead of one AI doing</text><text x="30" y="350" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">everything?</text><rect x="30" y="372" width="240" height="1" fill="#fff" fill-opacity="0.08"/><rect x="30.0" y="392" width="81.4" height="26" rx="3" fill="none" stroke="#fff" stroke-opacity="0.16"/><text x="70.7" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a8a8a" letter-spacing="1">AI AGENTS</text><rect x="119.4" y="392" width="88.0" height="26" rx="3" fill="none" stroke="#fff" stroke-opacity="0.16"/><text x="163.4" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a8a8a" letter-spacing="1">FINAL YEAR</text></g><g><rect x="325" y="0" width="300" height="440" rx="16" fill="#000"/><rect x="325.5" y="0.5" width="299" height="439" rx="16" fill="none" stroke="#fff" stroke-opacity="0.12"/>
<text x="353" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-4" fill="#161616">02</text>
<circle cx="589" cy="52" r="5" fill="#3B82F6"/>
<text x="355" y="176" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#fff">Heccker OS</text>
<rect x="355" y="194" width="95.8" height="26" rx="3" fill="#141414"/><text x="402.9" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#cfcfcf" letter-spacing="1.5">EXPLORING</text>
<text x="355" y="262" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">A more personal AI system.</text><text x="355" y="284" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">Useful without giving up</text><text x="355" y="306" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">security or control.</text><rect x="355" y="372" width="240" height="1" fill="#fff" fill-opacity="0.08"/><rect x="355.0" y="392" width="94.6" height="26" rx="3" fill="none" stroke="#fff" stroke-opacity="0.16"/><text x="402.3" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a8a8a" letter-spacing="1">PERSONAL AI</text><rect x="457.6" y="392" width="74.8" height="26" rx="3" fill="none" stroke="#fff" stroke-opacity="0.16"/><text x="495.0" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a8a8a" letter-spacing="1">SECURITY</text></g><g><rect x="650" y="0" width="300" height="440" rx="16" fill="#000"/><rect x="650.5" y="0.5" width="299" height="439" rx="16" fill="none" stroke="#fff" stroke-opacity="0.12"/>
<text x="678" y="118" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-4" fill="#161616">03</text>
<circle cx="914" cy="52" r="5" fill="#22C55E"/>
<text x="680" y="176" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#fff">CampUstore</text>
<rect x="680" y="194" width="112.2" height="26" rx="3" fill="#141414"/><text x="736.1" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#cfcfcf" letter-spacing="1.5">CO-BUILDING</text>
<text x="680" y="262" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">A marketplace built around</text><text x="680" y="284" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">campus life. Students buy,</text><text x="680" y="306" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">sell, and offer services to</text><text x="680" y="328" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9a9a9a">each other.</text><rect x="680" y="372" width="240" height="1" fill="#fff" fill-opacity="0.08"/><rect x="680.0" y="392" width="94.6" height="26" rx="3" fill="none" stroke="#fff" stroke-opacity="0.16"/><text x="727.3" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a8a8a" letter-spacing="1">MARKETPLACE</text><rect x="782.6" y="392" width="61.6" height="26" rx="3" fill="none" stroke="#fff" stroke-opacity="0.16"/><text x="813.4" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8a8a8a" letter-spacing="1">CAMPUS</text></g></svg>